<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STUFF | Product</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/style.css" />
    <link rel="stylesheet" href="../src/css/product.css">

    <script src="../src/js/script.js" defer></script>
    <script src="../src/js/product.js" defer></script>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <div>
          <a href="../index.html" class="nav-logo logo">Stuff<span class="logo-highlight">..</span></a>
          <span>Welcome!</span>
        </div>
        <div class="nav-actions">
          <!-- Desktop navigation -->
          <div class="nav-desktop-links">
            <a href="../account/login.html">Log in</a>
            <span>/</span>
            <a href="../account/register.html">Register</a>
            <a href="../cart/index.html" aria-label="Shopping cart">
              <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            </a>
          </div>

          <!-- Mobile navigation -->
          <button
            class="nav-burger"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="nav-mobile-menu">
          <a href="../account/login.html">Log in</a>
          <a href="../account/register.html">Register</a>
          <a href="../cart/index.html">Shopping cart</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="product">
        <div class="product-image">
          <img src="" alt="" />
        </div>

        <div class="product-info">
          <div class="product-heading">
            <h1></h1>
            <button
              class="share-button"
              type="button"
              aria-label="Share this product"
            >
              <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
            </button>
          </div>

          <div class="product-rating"></div>

          <div class="product-price"></div>

          <p class="product-description"></p>

          <div class="product-tags"></div>
        </div>

        <div class="product-purchase">
          <div class="quantity-selector">
            <button
              type="button"
              class="quantity-decrease"
              aria-label="Decrease quantity"
            >
              <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </button>

            <span class="quantity">1</span>

            <button
              type="button"
              class="quantity-increase"
              aria-label="Increase quantity"
            >
              <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
            </button>
          </div>

          <button type="button" class="add-to-cart">Add to cart</button>
        </div>
      </section>

      <section class="reviews">
        <h2>Customer reviews</h2>
        <div class="reviews-list">

          <article class="review-item">
            <i class="fa-solid fa-comments" aria-hidden="true"></i>
            <div>
              <div class="rating-review"></div>
              <p class="review"></p>
              <p class="user-review"></p>
            </div>
          </article>

        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-image">
        <picture>
          <source
            media="(min-width: 768px)"
            srcset="../assets/images/decorative-footer-desktop.png"
          />
          <img src="../assets/images/decorative-footer-mobile.png" alt="" />
        </picture>

        <div class="footer-content">
          <h2 class="logo">Stuff<span class="logo-highlight">..</span></h2>
          <p>Everyday things, better</p>
          <a href="" class="footer-terms">Terms & conditions</a>
        </div>

        <p class="footer-copyright">&reg; 2024 STUFF. All rights reserved</p>
      </div>
    </footer>
  </body>
</html>
