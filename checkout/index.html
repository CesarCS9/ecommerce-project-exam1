<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STUFF | Checkout</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/style.css" />

    <script src="../src/js/script.js" defer></script>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <div>
          <a href="../index.html" class="nav-logo logo">Stuff..</a>
          <span>Welcome!</span>
        </div>
        <div class="nav-actions">
          <!-- Desktop navigation -->
          <div class="nav-desktop-links">
            <a href="../account/login.html">Log in</a>
            <span>/</span>
            <a href="../account/register.html">Register</a>
            <a href="../cart/index.html" aria-label="Shopping cart">
              <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            </a>
          </div>

          <!-- Mobile navigation -->
          <button
            class="nav-burger"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="nav-mobile-menu">
          <a href="../account/login.html">Log in</a>
          <a href="../account/register.html">Register</a>
          <a href="../cart/index.html">Shopping cart</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="checkout">
        <h1>Checkout</h1>

        <div class="checkout-grid">

          <div class="shipping-details">
            <form action="">
              <h2>Shipping address</h2>
              <div class="form-field">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" required/>
              </div>
              <div class="form-field">
                <label for="address">Address</label>
                <input type="text" id="address"required/>
              </div>
              <div class="form-field">
                <label for="country">Country</label>
                <input type="text" id="country" required/>
              </div>
              <div class="form-field">
                <label for="postcode">Post code</label>
                <input type="text" id="postcode" required/>
              </div>
              <div class="form-field">
                <label for="phonenumber">Phone number</label>
                <input type="text" id="phonenumber" required/>
              </div>
            </form>
          </div>

          <div class="payment-options">
            <div class="payment-option">
              <input type="radio" id="card-payment" name="payment" aria-label="Credit or debit card"/>
              <i class="fa-brands fa-cc-visa" aria-label="Visa"></i>
              <i class="fa-brands fa-cc-mastercard" aria-label="Mastercard"></i>
            </div>
            <div class="payment-option">
              <input type="radio" id="google-payment" name="payment" aria-label="Google Pay"/>
              <i class="fa-brands fa-google-pay" aria-hidden="true"></i>
            </div>
          </div>

        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-image">
        <picture>
          <source
            media="(min-width: 768px)"
            srcset="../assets/images/decorative-footer-desktop.png"
          />
          <img src="../assets/images/decorative-footer-mobile.png" alt="" />
        </picture>

        <div class="footer-content">
          <h2 class="logo">Stuff<span class="logo-highlight">..</span></h2>
          <p>Everyday things, better</p>
          <a href="" class="footer-terms">Terms & conditions</a>
        </div>

        <p class="footer-copyright">&reg; 2024 STUFF. All rights reserved</p>
      </div>
    </footer>
  </body>
</html>
