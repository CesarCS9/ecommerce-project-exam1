<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STUFF | Register</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/style.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <div>
          <a href="../index.html" class="nav-logo logo">Stuff..</a>
          <span>Welcome!</span>
        </div>
        <div class="nav-actions">
          <!-- Desktop navigation -->
          <div class="nav-desktop-links">
            <a href="../account/login.html">Log in</a>
            <a href="../account/register.html">Register</a>
            <a href="../cart/index.html" aria-label="Shopping cart">
              <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            </a>
          </div>

          <!-- Mobile navigation -->
          <button
            class="nav-burger"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="nav-mobile-menu">
          <a href="../account/login.html">Log in</a>
          <a href="../account/register.html">Register</a>
          <a href="../cart/index.html">Shopping cart</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="register">
        <h1>Register</h1>
        <form class="register-form" action="">
          <div class="register-name">
            <div>
              <label for="name">First name</label>
              <input
                type="text"
                id="name"
                name="name"
                autocomplete="given-name"
                required
              />
            </div>
            <div>
              <label for="lastname">Last name</label>
              <input
                type="text"
                id="lastname"
                name="lastname"
                autocomplete="family-name"
                required
              />
            </div>
          </div>
          <div class="form-field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="terms">
            <input type="checkbox" id="agreeterms" name="agreeterms" required />
            <label for="agreeterms">Agree with our terms and conditions</label>
          </div>
          <button type="submit" class="register-btn">Create my account</button>
        </form>
      </section>
    </main>
    <footer>
      <picture>
        <source
          media="(min-width: 768px)"
          srcset="../assets/images/decorative-footer-desktop.png"
        />
        <img src="../assets/images/decorative-footer-mobile.png" alt="" />
      </picture>
      <div>
        <h2 class="logo">Stuff..</h2>
        <p>Everyday things, better</p>
      </div>
      <a href="">Terms & conditions</a>
      <p>&reg; 2024 STUFF. All rights reserved</p>
    </footer>
  </body>
</html>
