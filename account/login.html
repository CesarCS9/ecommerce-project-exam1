<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STUFF | Log in</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/style.css" />
  </head>
  <body>
    <main class="login-page">
      <video
        class="login-video"
        src="../assets/videos/hero-video.mp4"
        autoplay
        muted
        loop
        playsinline
        aria-hidden="true"
        width="100%"
      ></video>

      <div class="login-content">
        <header>
          <span>Welcome back :)</span>

          <div>
            <a href="../index.html" class="nav-logo logo">Stuff..</a>
            <p>Everyday things, better</p>
          </div>
        </header>

        <form action="">
          <h1>User Login</h1>

          <div>
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              autocomplete="email"
              required
            />
          </div>

          <div>
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="login">Log in</button>
        </form>

        <a href="register.html" class="create-account">
          Create your account
          <i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>
        </a>
      </div>
    </main>
  </body>
</html>
