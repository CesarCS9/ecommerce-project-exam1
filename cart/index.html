<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STUFF | Cart</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/style.css" />
    <link rel="stylesheet" href="../src/css/cart.css" />

    <script src="../src/js/script.js" defer></script>
    <script src="../src/js/cart.js" defer></script>
    <script src="../src/js/auth.js" defer></script>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <div>
          <a href="../index.html" class="nav-logo logo">Stuff<span class="logo-highlight">..</span></a>
          <span class="nav-welcome">Welcome!</span>
        </div>
        <div class="nav-actions">
          <!-- Desktop navigation -->
          <div class="nav-desktop-links">
            <a href="../account/login.html" id="login-link">Log in</a>
            <span>/</span>
            <a href="../account/register.html" id="register-link">Register</a>
            <a href="../cart/index.html" aria-label="Shopping cart">
              <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            </a>
          </div>

          <!-- Mobile navigation -->
          <button
            class="nav-burger"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="nav-mobile-menu">
          <a href="../account/login.html" id="mobile-login-link">Log in</a>
          <a href="../account/register.html" id="mobile-register-link">Register</a>
          <a href="../cart/index.html">Shopping cart</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="cart">
        <h1>Cart</h1>
        <div class="cart-card">
          <div class="cart-items"></div>

          <button type="button" class="clear-cart" aria-label="Clear all items">
            Clear all
          </button>

          <div class="cart-total">
            <h3>Subtotal</h3>
            <p class="subtotal"></p>
          </div>

          <a href="../checkout/index.html" class="checkout-button">
            Checkout
          </a>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-image">
        <picture>
          <source
            media="(min-width: 768px)"
            srcset="../assets/images/decorative-footer-desktop.png"
          />
          <img src="../assets/images/decorative-footer-mobile.png" alt="" />
        </picture>

        <div class="footer-content">
          <h2 class="logo">Stuff<span class="logo-highlight">..</span></h2>
          <p>Everyday things, better</p>
          <a href="" class="footer-terms">Terms & conditions</a>
        </div>

        <p class="footer-copyright">&reg; 2024 STUFF. All rights reserved</p>
      </div>
    </footer>
  </body>
</html>
